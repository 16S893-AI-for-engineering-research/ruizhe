[project]
name = "lorenz-1963-figure-2"
version = "0.1.0"
description = "A tested numerical reproduction of Lorenz (1963), Figure 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.scripts]
lorenz-figure = "lorenz1963.figure:main"
lorenz-table = "lorenz1963.table:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorenz1963"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
